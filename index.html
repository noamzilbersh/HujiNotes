<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Buy, sell and give away class notes and mock test notebooks with other students.">
  <meta name="color-scheme" content="light dark">
  <title>HujiNotes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <img id="uni-logo" class="uni-logo" src="assets/huji-logo.svg" alt="Hebrew University of Jerusalem">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-mark" aria-hidden="true">📚</span><span id="site-name">HujiNotes</span>
      </a>
      <nav id="nav" class="nav" aria-label="Main" hidden></nav>
      <div id="user-area" class="user-area"></div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer">
    <div class="container">
      <p>
        An unofficial student-made marketplace for <span id="footer-university">your university</span> students.
        Data is saved only in this browser, and payments happen directly between students.
      </p>
      <button class="link-btn" type="button" data-action="reset-demo">Reset demo data</button>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="container">This site needs JavaScript to run.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/help.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
